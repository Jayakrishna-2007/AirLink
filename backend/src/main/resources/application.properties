# ===================================================================
# AIRPLANE TICKET BOOKING MANAGEMENT SYSTEM - Spring Boot Properties
# B.Tech Computer Science Project Configuration
# ===================================================================

server.port=8080
spring.application.name=airplane-booking-system

# -------------------------------------------------------------------
# Active Profile: Default development profile uses in-memory H2
# -------------------------------------------------------------------
spring.profiles.active=dev

# -------------------------------------------------------------------
# H2 Database Configuration (Default Development / Viva Demonstration)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:airbookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

